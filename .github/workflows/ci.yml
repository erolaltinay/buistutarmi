name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm archetypes:check
      - run: pnpm i18n:check
      # Taslak mevzuat önizlemede uyarıdır; production derlemesi `--production` ile kırmızı olur (SPEC-legal §4).
      - run: pnpm legal:check
      - run: pnpm test
