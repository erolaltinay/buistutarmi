<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC658"/>
      <stop offset="1" stop-color="#F6A821"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1E3B"/>
      <stop offset="1" stop-color="#12142A"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="820" fill="#F7F3EC"/>

  <!-- ============ MARK (icon) definition via group, reused ============ -->
  <!-- Avatar version -->
  <g transform="translate(90,70)">
    <circle cx="150" cy="150" r="150" fill="url(#ink)"/>
    <!-- question hook + stem -->
    <path d="M 108,132 a 42,42 0 1 1 46,42 L 150,205"
          fill="none" stroke="url(#amber)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- upward arrow 'dot' -->
    <path d="M 150,224 L 176,262 L 150,250 L 124,262 Z" fill="url(#amber)"/>
    <text x="150" y="330" text-anchor="middle" font-size="17" fill="#8A8FA3" letter-spacing="2">AVATAR / PROFİL</text>
  </g>

  <!-- ============ Primary wordmark lockup ============ -->
  <g transform="translate(470,120)">
    <!-- small mark -->
    <circle cx="55" cy="70" r="55" fill="url(#ink)"/>
    <path d="M 35,60 a 15.5,15.5 0 1 1 17,15.5 L 55,97"
          fill="none" stroke="url(#amber)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 55,104 L 65,118 L 55,113 L 45,118 Z" fill="url(#amber)"/>

    <!-- wordmark -->
    <text x="140" y="52" font-size="34" font-weight="700" fill="#6B7180" letter-spacing="1">BU İŞ</text>
    <text x="140" y="108" font-size="72" font-weight="900" fill="#1B1E3B" letter-spacing="0">TUTAR MI<tspan fill="#F6A821">?</tspan></text>
    <text x="143" y="146" font-size="24" font-weight="600" fill="#8A8FA3" letter-spacing="3">YATIRIM ÖNCESİ NET ANALİZ</text>
  </g>

  <!-- divider -->
  <line x1="90" y1="470" x2="1110" y2="470" stroke="#E0D8CA" stroke-width="2"/>

  <!-- ============ Mono / reversed versions ============ -->
  <!-- mono dark on light -->
  <g transform="translate(120,520)">
    <path d="M 40,50 a 16,16 0 1 1 18,16 L 60,90"
          fill="none" stroke="#1B1E3B" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 60,98 L 71,114 L 60,108 L 49,114 Z" fill="#1B1E3B"/>
    <text x="0" y="150" font-size="16" fill="#8A8FA3" letter-spacing="2">TEK RENK (KOYU)</text>
  </g>

  <!-- reversed: light mark on ink block -->
  <g transform="translate(300,510)">
    <rect x="0" y="0" width="150" height="150" rx="24" fill="url(#ink)"/>
    <path d="M 55,60 a 16,16 0 1 1 18,16 L 75,100"
          fill="none" stroke="#F7F3EC" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 75,108 L 86,124 L 75,118 L 64,124 Z" fill="#F7F3EC"/>
    <text x="0" y="185" font-size="16" fill="#8A8FA3" letter-spacing="2">NEGATİF (AÇIK)</text>
  </g>

  <!-- color palette -->
  <g transform="translate(560,520)">
    <text x="0" y="-6" font-size="16" fill="#6B7180" letter-spacing="2" font-weight="700">RENK PALETİ</text>
    <rect x="0" y="8" width="90" height="90" rx="10" fill="#1B1E3B"/>
    <text x="0" y="120" font-size="13" fill="#8A8FA3">Mürekkep</text>
    <text x="0" y="138" font-size="12" fill="#B0A99C">#1B1E3B</text>

    <rect x="110" y="8" width="90" height="90" rx="10" fill="#F6A821"/>
    <text x="110" y="120" font-size="13" fill="#8A8FA3">Amber</text>
    <text x="110" y="138" font-size="12" fill="#B0A99C">#F6A821</text>

    <rect x="220" y="8" width="90" height="90" rx="10" fill="#FFC658"/>
    <text x="220" y="120" font-size="13" fill="#8A8FA3">Açık amber</text>
    <text x="220" y="138" font-size="12" fill="#B0A99C">#FFC658</text>

    <rect x="330" y="8" width="90" height="90" rx="10" fill="#F7F3EC" stroke="#E0D8CA" stroke-width="1"/>
    <text x="330" y="120" font-size="13" fill="#8A8FA3">Krem</text>
    <text x="330" y="138" font-size="12" fill="#B0A99C">#F7F3EC</text>
  </g>

  <!-- concept note -->
  <text x="90" y="740" font-size="18" fill="#6B7180">Konsept: soru işareti = "açayım mı?" · yukarı ok = verinin verdiği cevap / büyüme</text>
  <text x="90" y="768" font-size="18" fill="#6B7180">Amber = fırsat / para · koyu lacivert = güven / analiz otoritesi</text>
</svg>
