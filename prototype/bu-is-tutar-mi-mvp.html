<title>Bu İş Tutar mı?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: brand bar, tab strip, then per-tab two-pane workbench — inputs left, live read-out right (read-out first on phones). */
:root{
  --bg:#F3F1EC; --surface:#FFFFFF; --sunk:#ECE9E1; --ink:#1B1E3B; --muted:#5D6278; --line:#DEDACF;
  --amber:#E99A10; --amber-soft:#FBE8C2;
  --pos:#2F6FB0; --neg:#C2412D;
  --good:#1D7A4C; --good-soft:#DDF1E6; --warn:#A86200; --warn-soft:#FBEBD0; --bad:#B3261E; --bad-soft:#F8DEDC;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1126; --surface:#181B36; --sunk:#12142C; --ink:#ECEEF6; --muted:#A2A7C0; --line:#2B2F57;
  --amber:#F5B03A; --amber-soft:#3A2F17; --pos:#4A8FD4; --neg:#E0674F;
  --good:#5BCB92; --good-soft:#163A2A; --warn:#F3B455; --warn-soft:#3B2C12; --bad:#F27B72; --bad-soft:#3E1C1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1126; --surface:#181B36; --sunk:#12142C; --ink:#ECEEF6; --muted:#A2A7C0; --line:#2B2F57;
  --amber:#F5B03A; --amber-soft:#3A2F17; --pos:#4A8FD4; --neg:#E0674F;
  --good:#5BCB92; --good-soft:#163A2A; --warn:#F3B455; --warn-soft:#3B2C12; --bad:#F27B72; --bad-soft:#3E1C1C; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:46px;height:46px;flex:none}
.brand h1{font-family:var(--display);font-weight:900;font-size:1.55rem;line-height:1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand h1 b{color:var(--amber)}
.brand p{margin:4px 0 0;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{font:600 .85rem var(--body);color:var(--muted);background:none;border:0;border-radius:7px;padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
select{font:600 .85rem var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 30px 8px 12px;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.notice{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.ghost{font:600 .82rem var(--body);color:var(--ink);background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.ghost:hover{border-color:var(--amber)}
.solid{font:700 .85rem var(--body);color:#1B1E3B;background:var(--amber);border:0;border-radius:9px;padding:9px 14px;cursor:pointer}
.solid:disabled{opacity:.55;cursor:progress}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{font:700 .9rem var(--display);letter-spacing:.02em;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 9px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber)}

.bench{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:24px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:860px){.bench{grid-template-columns:minmax(0,1fr)}.side{position:static;order:-1}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.panel h2{font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.02em;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.panel h2 small{font:500 .78rem var(--mono);color:var(--muted)}
.hint{margin:-6px 0 12px;font-size:.8rem;color:var(--muted)}

.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 8.5rem 2rem;gap:6px;align-items:center}
.row.item{grid-template-columns:minmax(0,1fr) repeat(3,5.6rem) 2rem}
.row.head{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row.head span:not(:first-child){text-align:right}
input,textarea{width:100%;min-width:0;font:500 .9rem var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
input[type=number]{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.del{width:2rem;height:2rem;border:0;background:none;color:var(--muted);border-radius:6px;cursor:pointer;font-size:1.1rem;line-height:1}
.del:hover{background:var(--bad-soft);color:var(--bad)}
.add{margin-top:8px;font:600 .82rem var(--body);color:var(--ink);background:none;border:1px dashed var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;align-self:flex-start}
.add:hover{border-color:var(--amber)}
label.mob{display:contents}
label.mob > span{display:none}
@media (max-width:560px){
  .row.item{grid-template-columns:repeat(3,minmax(0,1fr)) 2rem}
  .row.item .nm{grid-column:1 / -1}
  .row.item.head{display:none}
  .row.item input[type=number]{text-align:left}
  label.mob{display:flex;flex-direction:column;gap:2px;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  label.mob > span{display:block}
  .row{grid-template-columns:minmax(0,1fr) 7rem 2rem}
}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);font-weight:500;min-width:0}
.warn{margin-top:10px;font-size:.8rem;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:6px 10px}

.verdict{border-radius:14px;padding:16px 18px;border:1px solid var(--line);background:var(--surface);display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:center}
.stamp{grid-row:span 3;font-family:var(--display);font-weight:900;font-size:1.35rem;letter-spacing:.04em;padding:10px 14px;border-radius:10px;border:2px solid currentColor;transform:rotate(-3deg)}
.v-go .stamp{color:var(--good);background:var(--good-soft)}
.v-mid .stamp{color:var(--warn);background:var(--warn-soft)}
.v-no .stamp{color:var(--bad);background:var(--bad-soft)}
.verdict p{margin:0;font-size:.9rem}
.eyebrow{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 6px}
.verdict .eyebrow{margin:0}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 .74rem var(--body);padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);width:fit-content}
.pill.good{color:var(--good);background:var(--good-soft);border-color:transparent}
.pill.mid{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.pill.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}

.be{background:var(--ink);color:var(--bg);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:2px}
.be .eyebrow{color:color-mix(in srgb,var(--bg) 65%,var(--ink))}
.be-line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.be-num{font-family:var(--display);font-weight:900;font-size:3.4rem;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums}
.be-unit{font-family:var(--display);font-weight:700;font-size:1.1rem}
.be p{margin:6px 0 0;font-size:.85rem;color:color-mix(in srgb,var(--bg) 78%,var(--ink))}
.meter{margin-top:10px;height:8px;border-radius:99px;background:color-mix(in srgb,var(--bg) 20%,var(--ink));overflow:hidden}
.meter i{display:block;height:100%;background:var(--amber);border-radius:99px}

.chart{position:relative;display:flex;flex-direction:column;gap:12px;padding-top:22px}
.bar{display:grid;grid-template-columns:5.6rem minmax(0,1fr);gap:10px;align-items:center;font-size:.82rem}
.bar .track{position:relative;height:26px;background:var(--sunk);border-radius:6px}
.bar .fill{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--amber-soft);border-right:3px solid var(--amber)}
.bar .val{position:absolute;left:8px;top:50%;transform:translateY(-50%);font:600 .78rem var(--mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar .net{display:block;font:600 .74rem var(--mono);margin-top:2px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.chart-area{position:absolute;top:0;bottom:0;left:calc(5.6rem + 10px);right:0}
.bemark{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--ink);pointer-events:none}
.bemark span{position:absolute;top:0;left:4px;font:600 .7rem var(--mono);white-space:nowrap;color:var(--ink);background:var(--surface);padding:0 3px}

.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;margin:0;font-size:.88rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font:600 .9rem var(--mono);font-variant-numeric:tabular-nums}
.kv .em{color:var(--ink);font-weight:600}
.kv dd.big{font-size:1.02rem;color:var(--ink)}
.split{border-top:1px solid var(--line);grid-column:1 / -1;height:0}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:0 0 6px}
td{padding:6px 0;border-top:1px solid var(--line)}
th:not(:first-child),td:not(:first-child){text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
ol.q{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
ol.q li::marker{font-family:var(--mono);color:var(--amber);font-weight:600}

/* competitors */
.comp{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.comp-top{display:grid;grid-template-columns:1.8rem minmax(0,1fr) 2rem;gap:8px;align-items:center}
.tagletter{width:1.8rem;height:1.8rem;border-radius:50%;display:grid;place-items:center;font:700 .8rem var(--mono);background:var(--ink);color:var(--bg)}
.comp .fields{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:560px){.comp .fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
.comp input{background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chips .lab{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;width:4.2rem}
.chip{font:500 .76rem var(--body);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 9px;cursor:pointer}
.chip.s[aria-pressed="true"]{color:var(--good);background:var(--good-soft);border-color:var(--good)}
.chip.w[aria-pressed="true"]{color:var(--bad);background:var(--bad-soft);border-color:var(--bad)}
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font:700 1.5rem var(--display);font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.76rem;color:var(--muted)}
.gaplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.gaplist li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:.86rem}
.gaplist .share{font:600 .76rem var(--mono);color:var(--bad);background:var(--bad-soft);border-radius:6px;padding:2px 6px;height:fit-content}
.gaplist .share.s{color:var(--good);background:var(--good-soft)}
.gaplist strong{display:block}
.gaplist p{margin:0;color:var(--muted)}

/* price band */
.band{position:relative;height:96px;margin:6px 14px 0}
.band .rail{position:absolute;left:0;right:0;top:50px;height:6px;border-radius:99px;background:var(--sunk)}
.band .avg{position:absolute;top:36px;height:34px;border-left:2px dashed var(--muted)}
.band .avg span{position:absolute;top:36px;left:0;transform:translateX(-50%);font:600 .7rem var(--mono);color:var(--muted);white-space:nowrap}
.band .dot{position:absolute;top:43px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px}
.band .dot i{width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--bg);font:700 .66rem var(--mono);display:grid;place-items:center;font-style:normal}
.band .dot small{font:600 .7rem var(--mono);color:var(--muted);white-space:nowrap;margin-top:22px;position:absolute;top:2px}
.band .you{position:absolute;top:2px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.band .you em{font:700 .72rem var(--body);font-style:normal;color:#1B1E3B;background:var(--amber);border-radius:6px;padding:2px 7px;white-space:nowrap}
.band .you i{width:2px;height:28px;background:var(--amber)}
.strat{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.scard{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:8px;position:relative}
.scard.rec{border:2px solid var(--amber)}
.scard .badge{position:absolute;top:-10px;right:12px;font:700 .68rem var(--body);letter-spacing:.06em;text-transform:uppercase;background:var(--amber);color:#1B1E3B;border-radius:6px;padding:2px 8px}
.scard h3{margin:0;font:700 1rem var(--display)}
.scard .price{font:900 1.8rem var(--display);font-variant-numeric:tabular-nums;line-height:1}
.scard p{margin:0;font-size:.82rem;color:var(--muted)}
.scard .kv{font-size:.8rem}
.scard .kv dd{font-size:.82rem}

/* storefront */
.sf-frame{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#DCD6CA}
.sf-frame svg{display:block;width:100%;height:auto}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);cursor:pointer;padding:0;overflow:hidden;display:grid;grid-template-rows:1fr 1fr}
.swatch[aria-pressed="true"]{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber)}
.swatch span{display:block}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}

.ai{display:flex;flex-direction:column;gap:10px}
.ai-out{font-size:.9rem;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:3rem}
.ai-out h4{font:700 .95rem var(--display);margin:12px 0 4px}
.ai-out h4:first-child{margin-top:0}
.ai-out ul{margin:0;padding-left:1.1rem}
.ai-out p{margin:0 0 6px}
.ai-out.empty{color:var(--muted)}
.note{font-size:.78rem;color:var(--muted);margin:0}
footer{font-size:.8rem;color:var(--muted);text-align:center}
.cand{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.cand > div:first-child{display:flex;flex-direction:column;min-width:0}
.cand strong{font-size:.92rem}
.cmp{width:100%;min-width:520px;font-size:.84rem}
.cmp th{vertical-align:bottom}
.cmp th .sub{display:block;font-size:.68rem;letter-spacing:0;text-transform:none;font-weight:500;color:var(--muted)}
.cmp td.best{background:var(--good-soft);color:var(--good);font-weight:700}
.cmp td:first-child{color:var(--muted);font-family:var(--body);text-align:left}
.pwrap{position:relative;margin-top:6px}
.pchart{width:100%;height:auto;display:block;overflow:visible}
.pchart .bp{fill:var(--pos)} .pchart .bn{fill:var(--neg)}
.pchart .ln{fill:none;stroke:var(--pos);stroke-width:2;stroke-linejoin:round}
.pchart .ax0{stroke:var(--muted);stroke-width:1}
.pchart .tk{fill:var(--muted);font:500 11px var(--mono)}
.pchart .lb{fill:var(--ink);font:600 11px var(--body)}
.pchart .hit{fill:transparent}
.pchart .hit:hover{fill:var(--ink);fill-opacity:.05}
.pchart .dot{fill:var(--neg);stroke:var(--surface);stroke-width:2}
.ptip{position:absolute;top:0;transform:translate(-50%,-100%);background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 9px;font-size:.76rem;display:flex;flex-direction:column;gap:1px;pointer-events:none;white-space:nowrap;z-index:2;font-variant-numeric:tabular-nums}
.plegend{display:flex;gap:14px;font-size:.76rem;color:var(--muted);margin-top:4px}
.plegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tscroll{overflow-x:auto;margin-top:8px}
.tscroll table{min-width:540px;font-size:.78rem}
details.pt summary{cursor:pointer;font-weight:600;font-size:.86rem;margin-top:14px}
.ftable{display:grid;grid-template-columns:5.5rem repeat(3,minmax(0,1fr));gap:6px;align-items:center;font-size:.8rem}
.ftable .h{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center}
.ftable .r{color:var(--muted);font-weight:600}
.field select{width:100%}
.check{display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--ink);cursor:pointer}
.check input{width:auto;accent-color:var(--amber)}
.chkgroups{display:flex;flex-direction:column;gap:14px}
.chkitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.86rem;padding:7px 0;border-top:1px solid var(--line)}
.chkitem .crit{font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--bad);font-weight:700;margin-left:6px;white-space:nowrap}
.tri{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:2px;width:fit-content}
.tri button{font:600 .76rem var(--body);color:var(--muted);background:none;border:0;border-radius:6px;padding:4px 9px;cursor:pointer;min-width:2.4rem}
.tri button[aria-pressed="true"][data-v="1"]{background:var(--good-soft);color:var(--good)}
.tri button[aria-pressed="true"][data-v="0"]{background:var(--bad-soft);color:var(--bad)}
.tri button[aria-pressed="true"][data-v=""]{background:var(--surface);color:var(--ink)}
.lrow{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.lrow .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lrow .lbl{font-size:.88rem;font-weight:600}
.lrow b{font:600 1rem var(--mono);font-variant-numeric:tabular-nums}
.lrow p{margin:0;font-size:.8rem;color:var(--muted)}
.flaglist{margin:0;padding-left:1.1rem;font-size:.86rem;display:flex;flex-direction:column;gap:4px}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;cursor:pointer;background:var(--bg)}
.drop.over{border-color:var(--amber);background:var(--amber-soft)}
.drop:focus-within{outline:2px solid var(--amber);outline-offset:2px}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop-t{font:700 1rem var(--display)}
.drop-s{font-size:.8rem;color:var(--muted);max-width:52ch}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.mthumb{position:relative;display:block;padding:0;border:0;background:var(--sunk);aspect-ratio:4/3;width:100%;max-width:100%;cursor:zoom-in;overflow:hidden}
.mthumb img,.mthumb video{width:100%;height:100%;object-fit:cover;display:block}
.mtype{position:absolute;left:8px;top:8px;font:700 .64rem var(--body);letter-spacing:.1em;background:rgba(0,0,0,.65);color:#fff;border-radius:5px;padding:2px 6px}
.mbody{display:flex;flex-direction:column;gap:6px;padding:10px}
.mbody select{width:100%;font-size:.8rem;padding:7px 28px 7px 10px}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mempty{grid-column:1/-1;color:var(--muted);font-size:.9rem}
dialog#lb{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:0;width:min(960px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto}
dialog#lb::backdrop{background:rgba(10,12,30,.62)}
.lb-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.lb-head strong{font:700 .95rem var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lb-media{background:#000;display:grid;place-items:center}
.lb-media img,.lb-media video{display:block;max-width:100%;max-height:60vh;width:auto;height:auto}
.lb-ai{padding:14px 16px 18px;display:flex;flex-direction:column;gap:10px}
.sugrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.86rem}
.ai-out table{margin-top:6px}
@media (max-width:560px){.chkitem{grid-template-columns:minmax(0,1fr)}.ftable{grid-template-columns:4.2rem repeat(3,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){.fill,.meter i{transition:width .25s ease}}
</style>

function finDefaults(biz,cur){const tr=cur==='TRY',cof=biz==='coffee';
  return{rampStart:50,rampMonths:6,priceInc:tr?30:3,inflCost:tr?30:3,rentInc:tr?30:3,wageInc:tr?30:4,ownerSalary:0,

    stopaj:tr?20:0,employer:tr?20:10,profitTax:25,loanRate:tr?45:10,loanTerm:tr?36:60,depYears:5};}
const pc=x=>pf(x)/100;
function feeRate(){const F=S.fin;return pc(F.cardShare)*pc(F.cardFee)+pc(F.platShare)*pc(F.platFee);}
function econ(items){
  const F=S.fin,kdv=pc(F.kdv),w=pc(F.waste),fr=feeRate();
  const mixSum=items.reduce((a,r)=>a+pf(r.mix),0);
  if(!(mixSum>0))return{mixSum,cm:0,ticket:0,ticketNet:0,costAvg:0};
  const W=r=>pf(r.mix)/mixSum;
  const ticket=items.reduce((a,r)=>a+pf(r.price)*W(r),0);
  const costAvg=items.reduce((a,r)=>a+pf(r.cost)*W(r),0);
  const ticketNet=ticket/(1+kdv);
  const cm=ticketNet-costAvg*(1+w)-ticket*fr;
  return{mixSum,cm,ticket,ticketNet,costAvg};
}
const isRentRow=r=>r.k==='rent'||(!r.k&&/kira|rent/i.test(lab(r)));
const isStaffRow=r=>/^staff/.test(r.k||'')||(!r.k&&/personel|staff|maaş|wage|payroll/i.test(lab(r)));
function annuity(P,r,n){if(!(P>0))return 0;return r>0?P*r/(1-Math.pow(1+r,-n)):P/n;}
function project(o){
  const F=S.fin,kdv=pc(F.kdv),w=pc(F.waste),fr=feeRate(),tax=pc(F.profitTax),r=pc(F.loanRate)/12;
  const rs=Math.min(1,Math.max(0,pc(F.rampStart))),rm=Math.max(1,Math.round(pf(F.rampMonths)));
  const dep=o.depBase/(Math.max(1,pf(F.depYears))*12);
  const g=(rate,m)=>Math.pow(1+pc(rate),(m-1)/12),st=(rate,m)=>Math.pow(1+pc(rate),Math.floor((m-1)/12));
  let bal=o.loan,cash=0,trough=0,troughM=0,loss=0,firstProfit=null,sum24=0;const rows=[];
  for(let m=1;m<=60;m++){
    const ramp=m>=rm?1:rs+(1-rs)*(m-1)/Math.max(1,rm-1);
    const units=o.base*o.days*ramp;
    const gross=units*o.ticket*g(F.priceInc,m);
    const net=gross/(1+kdv);
    const cogs=units*o.costAvg*(1+w)*g(F.inflCost,m);
    const fees=gross*fr;
    const fixed=o.rent0*st(F.rentInc,m)+(o.staff0+o.mgr+o.owner)*st(F.wageInc,m)+o.other0*g(F.inflCost,m);
    const ebitda=net-cogs-fees-fixed;
    const interest=bal>0?bal*r:0;
    const pay=bal>0?Math.min(o.pmt,bal+interest):0;
    const principal=Math.max(0,pay-interest);bal=Math.max(0,bal-principal);
    const ebt=ebitda-dep-interest;
    let taxable=0;if(ebt>0){const use=Math.min(loss,ebt);loss-=use;taxable=ebt-use;}else loss+=-ebt;
    const tx=taxable*tax,ni=ebt-tx,cf=ni+dep-principal;
    cash+=cf;if(m<=24&&cash<trough){trough=cash;troughM=m;}
    if(firstProfit==null&&ni>0)firstProfit=m;
    if(m<=24)sum24+=ni;
    rows.push({m,units,gross,net,cogs,fees,fixed,ebitda,interest,principal,tax:tx,ni,dep,cf,cash});
  }
  return{rows,trough:-trough,troughM,firstProfit,sum24};
}
function calc(){
  const capexSub=S.capex.reduce((a,r)=>a+pf(r.v),0);
  const capexTotal=capexSub*(1+pf(S.contPct)/100);
  const nonDep=S.capex.filter(r=>/^(stock|stockB|permits)$/.test(r.k||'')).reduce((a,r)=>a+pf(r.v),0);
  const depBase=Math.max(0,capexTotal-nonDep);
  const F=S.fin,fd=(S.loc&&S.loc.founder)||{};
  const emp=pc(F.employer),stp=Math.min(.9,pc(F.stopaj));
  let rent0=0,staff0=0,other0=0;
  S.fixed.forEach(r=>{const v=pf(r.v);if(isRentRow(r))rent0+=v/(1-stp);else if(isStaffRow(r))staff0+=v*(1+emp);else other0+=v;});
  const fixedBase=S.fixed.reduce((a,r)=>a+pf(r.v),0);
  const mgrRaw=fd.role==='investor'?pf(fd.mgr):fd.role==='part'?pf(fd.mgr)/2:0;
  const mgr=mgrRaw*(1+emp),owner=pf(F.ownerSalary);
  const opFixed=rent0+staff0+other0+mgr+owner;
  const {mixSum,cm,ticket,ticketNet,costAvg}=econ(S.items);
  const days=Math.max(1,pf(S.days));
  const base=pf(S.scen[1]);
  const eq=Math.min(1,Math.max(0,pc(fd.equity==null?100:fd.equity)));
  const cushion=opFixed*pf(S.wcMonths);
  let trough=opFixed*2,proj=null,loan=0,pmt=0,invest=0;
  for(let it=0;it<5;it++){
    invest=capexTotal+trough+cushion;loan=invest*(1-eq);
    pmt=annuity(loan,pc(F.loanRate)/12,Math.max(1,Math.round(pf(F.loanTerm))));
    proj=project({base,days,ticket,costAvg,rent0,staff0,other0,mgr,owner,depBase,loan,pmt});
    trough=proj.trough;
  }
  invest=capexTotal+trough+cushion;
  const wc=trough+cushion;
  const fixed=opFixed+pmt;
  const beMonth=cm>0?fixed/cm:Infinity, beDay=beMonth/days;
  const nets=S.scen.map(d=>pf(d)*days*cm-fixed);

    days,beMonth,beDay,nets,base,baseNet,payAll,payOpen,maxDaily,rows:proj.rows,firstProfit:proj.firstProfit,sum24:proj.sum24};
}

  const reqCap=hasFoot&&daily>0&&isFinite(c.beDay)?c.beDay/daily*100:null;
  const baseCap=hasFoot&&daily>0?c.base/daily*100:null;
  const FT=isSvc()?[0.6,1.5]:[2,4];
  const footSt=reqCap==null?null:reqCap<=FT[0]?'good':reqCap<=FT[1]?'mid':'bad';
  const rentRow=S.fixed.find(r=>r.k==='rent')||S.fixed.find(r=>/kira|rent/i.test(lab(r)));
  const rent=rentRow?pf(rentRow.v)/(1-Math.min(.9,pc(S.fin.stopaj))):null;
  const revBase=c.base*c.days*c.ticketNet;
  const revBE=isFinite(c.beMonth)?c.beMonth*c.ticketNet:null;
  const rr=rent!=null&&revBase>0?rent/revBase*100:null;
  const rrBE=rent!=null&&revBE>0?rent/revBE*100:null;
  const RT=isSvc()?[15,22]:[12,18];
  const rentSt=rr==null?null:rr<=RT[0]?'good':rr<=RT[1]?'mid':'bad';
  const worse=(cur,s)=>s==='bad'||(s==='mid'&&cur==='good')?s:cur;
  const h=L0.hist,to=pf(h.turnover),cl=pf(h.closures),hMsgs=[];let histSt='good';
  if(to>=3){histSt=worse(histSt,'bad');hMsgs.push(t('hTurnBad'));}else if(to===2){histSt=worse(histSt,'mid');hMsgs.push(t('hTurnMid'));}
  if(h.reason==='noProfit'){histSt=worse(histSt,'bad');hMsgs.push(t('hNoProfit'));}else if(h.reason==='rent'){histSt=worse(histSt,'mid');hMsgs.push(t('hRent'));}
  if(cl>=4){histSt=worse(histSt,'bad');hMsgs.push(t('hClosBad'));}else if(cl>=2){histSt=worse(histSt,'mid');hMsgs.push(t('hClosMid'));}
  if(!hMsgs.length)hMsgs.push(t('hOk'));
  const f=L0.founder,fMsgs=[];let fSt='good';
  if(c.mgr>0){fSt=worse(fSt,'mid');fMsgs.push(t('fMgr')(isFinite(c.beDayNoMgr)?num(Math.ceil(c.beDayNoMgr)):'—',isFinite(c.beDay)?num(Math.ceil(c.beDay)):'—'));}
  if(pf(f.years)<1){fSt=worse(fSt,'mid');fMsgs.push(t('fYears'));}
  if(pf(f.runway)<3){fSt=worse(fSt,'bad');fMsgs.push(t('fRunBad'));}else if(pf(f.runway)<6){fSt=worse(fSt,'mid');fMsgs.push(t('fRunMid'));}
  if(pf(f.equity)<40){fSt=worse(fSt,'bad');fMsgs.push(t('fEqBad'));}else if(pf(f.equity)<60){fSt=worse(fSt,'mid');fMsgs.push(t('fEqMid'));}
  if(!fMsgs.length)fMsgs.push(t('fOk'));
  let y=0,n=0,u=0;const nos=[],unks=[],crit=[];
  CHK.forEach(g=>g.items.forEach(it=>{const v=L0.chk[it.k];if(v===1)y++;else if(v===0){n++;nos.push(it);if(it.crit)crit.push(it);}else{u++;unks.push(it);}}));
  const tot=y+n+u,cs=tot?(y+.5*u)/tot*100:0;
  const chkSt=crit.length?'bad':cs>=70?'good':cs>=45?'mid':'bad';
  const flags=[];
  if(footSt==='bad')flags.push(t('fFoot'));
  if(rentSt==='bad')flags.push(t('fRentF'));
  if(histSt==='bad')flags.push(t('fHist'));
  crit.forEach(it=>flags.push(it.flag[LI()]));
  if(fSt==='bad')flags.push(t('fFounder'));
  const confirm=[];
  if(!hasFoot)confirm.push(t('cFoot'));
  unks.filter(it=>it.crit).forEach(it=>confirm.push(chkLabel(it)));
  if(!h.talked)confirm.push(t('cTalk'));
  const P2={good:100,mid:60,bad:20};
  const sts=[footSt,rentSt,histSt,fSt,chkSt].filter(Boolean);
  const score=sts.length?sts.reduce((a,s)=>a+P2[s],0)/sts.length:0;
  const blocker=L0.chk.permitOk===0;
  return{blocker,daily,hasFoot,openH,reqCap,baseCap,footSt,rent,revBase,rr,rrBE,rentSt,histSt,hMsgs,fSt,fMsgs,y,n,u,chkSt,nos,flags,confirm,score};
}
function verdict(c){
  const [k,why]=finVerdict(c);
  const lc0=locCalc(),f=lc0.flags;
  if(lc0.blocker)return['NO',t('whyPermit')];
  if(k!=='NO'&&f.length>=2)return['NO',t('whyLocNo')(f.join(', '))];
  if(k==='GO'&&f.length===1)return['MID',t('whyLocMid')(f[0])];
  if(k==='MID'&&f.length===1)return['MID',why+' '+t('whyLocAlso')(f[0])];
  return[k,why];
}

function chartFrame(rows,vals){
  const W=480,H=176,L=52,R=10,T=14,B=24,iw=W-L-R,ih=H-T-B;
  const mx=Math.max(0,...vals),mn=Math.min(0,...vals),span=(mx-mn)||1;
  const y=v=>T+(mx-v)/span*ih,bw=iw/rows.length;
  let s=`<line x1="${L}" x2="${W-R}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" class="ax0"/>`;
  s+=`<text x="${L-6}" y="${(y(mx)+4).toFixed(1)}" class="tk" text-anchor="end">${cmoney(mx)}</text>`;
  if(mn<0&&y(mn)-y(mx)>14)s+=`<text x="${L-6}" y="${(y(mn)+4).toFixed(1)}" class="tk" text-anchor="end">${cmoney(mn)}</text>`;
  if(mx>0&&mn<0&&y(0)-y(mx)>14&&y(mn)-y(0)>14)s+=`<text x="${L-6}" y="${(y(0)+4).toFixed(1)}" class="tk" text-anchor="end">0</text>`;
  [1,6,12,18,24].filter(m=>m<=rows.length).forEach(m=>{s+=`<text x="${(L+(m-.5)*bw).toFixed(1)}" y="${H-6}" class="tk" text-anchor="middle">${m}</text>`;});
  const hits=rows.map((r,i)=>`<rect class="hit" data-m="${i}" x="${(L+i*bw).toFixed(1)}" y="${T}" width="${bw.toFixed(1)}" height="${ih}"/>`).join('');
  return{W,H,L,T,ih,bw,y,s,hits};
}

function mdLite(s){
  const lines=esc(s).split(/\r?\n/);let out='',inList=false;
  const inl=x=>x.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  for(const raw of lines){const l=raw.trim();
    if(/^#{1,4}\s/.test(l)){if(inList){out+='</ul>';inList=false;}out+=`<h4>${inl(l.replace(/^#{1,4}\s/,''))}</h4>`;}
    else if(/^[-*•]\s/.test(l)){if(!inList){out+='<ul>';inList=true;}out+=`<li>${inl(l.replace(/^[-*•]\s/,''))}</li>`;}
    else if(l){if(inList){out+='</ul>';inList=false;}out+=`<p>${inl(l)}</p>`;}}
  if(inList)out+='</ul>';return out;
}

/* ---------- pricing ---------- */
function strategies(){
  const cc=compCalc(),c=calc();
  const your=cc.your;
  const ref=cc.pavg||your;
  const list=[['now',your],['pen',roundP(ref*0.9)],['match',roundP(ref)],['prem',roundP(ref*1.15)]];
  const qShare=Math.max(0,...QUALITY_GAP[S.biz].map(k=>{const x=cc.ws.find(w=>w.k===k);return x?x.share:0;}));
  const eShare=(cc.ws.find(w=>w.k==='expensive')||{share:0}).share;
  let rec='match',why='match';
  if(cc.pavg==null){rec='now';why=null;}
  else if(cc.satKey==='hi'){rec='match';why='sat';}
  else if(qShare>=.5){rec='prem';why='prem';}
  else if(eShare>=.5){rec='pen';why='pen';}
  else{const dc=demoCalc();if(dc.idx!=null&&dc.idx>=125){rec='prem';why='incHi';}else if(dc.idx!=null&&dc.idx<=85){rec='pen';why='incLo';}}
  return{cc,c,rec,why,cards:list.map(([k,price])=>{
    const r=your>0?price/your:1;
    const items=S.items.map((it,i)=>({...it,price:i===0?price:roundP(pf(it.price)*r)}));
    const e=econ(items);
    const be=e.cm>0?c.fixed/e.cm/c.days:Infinity;
    const net=c.base*c.days*e.cm-c.fixed;
    return{k,price,items,cm:e.cm,be,net,over:isFinite(be)&&be>c.base};})};
}
function renderPricing(){
  const {cc,c,rec,why,cards}=strategies();
  const itemName=lab(S.items[0]||{});
  if(cc.pavg==null){$('bandPanel').innerHTML=`<h2>${t('bandTitle')}</h2><p class="note">${t('noPrices')}</p>`;}
  else{
    const pts=cc.within.filter(x=>pf(x.price)>0);
    const lo=Math.min(cc.pmin,cc.your)*0.9,hi=Math.max(cc.pmax,cc.your)*1.08;
    const pos=v=>Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100));
    const dots=pts.map(x=>{const i=S.comp.indexOf(x);return `<div class="dot" style="left:${pos(pf(x.price))}%" title="${esc(lab(x))}"><i>${letter(i)}</i><small>${money(pf(x.price))}</small></div>`;}).join('');
    const diff=(cc.your/cc.pavg-1)*100;
    const posTxt=Math.abs(diff)<2?t('posAt'):diff>0?t('posAbove')(num(diff)):t('posBelow')(num(-diff));
    $('bandPanel').innerHTML=`<h2><span>${t('bandTitle')}</span><small>${esc(itemName)}</small></h2><p class="hint">${t('bandHint')(money(cc.your))}</p>`+
      `<div class="band"><div class="rail"></div><div class="avg" style="left:${pos(cc.pavg)}%"><span>${t('avg')} ${money(cc.pavg)}</span></div>${dots}`+
      `<div class="you" style="left:${pos(cc.your)}%"><em>${t('you')} ${money(cc.your)}</em><i></i></div></div>`+
      `<p style="margin:14px 0 0;font-size:.9rem">${posTxt}</p>`;
  }
  const cardHTML=cards.map(s=>{
    const isRec=s.k===rec;
    return `<div class="scard${isRec?' rec':''}">${isRec?`<span class="badge">${t('rec')}</span>`:''}<h3>${t('st_'+s.k)}</h3><div class="price">${money(s.price)}</div><p>${t('st_'+s.k+'D')}</p>`+
      `<dl class="kv"><dt>${t('newCM')}</dt><dd>${money(s.cm)}</dd><dt>${t('beDay')}</dt><dd>${isFinite(s.be)?num(Math.ceil(s.be)):'—'}</dd><dt>${t('netBase')}</dt><dd class="${s.net>=0?'pos':'neg'}">${money(s.net)}</dd></dl>`+
      (s.over?`<span class="pill bad">${t('beAbove')}</span>`:'')+
      (s.k!=='now'?`<button class="ghost" type="button" data-apply="${s.k}">${t('apply')}</button>`:'')+`</div>`;}).join('');
  $('stratWrap').innerHTML=`<div class="panel"><h2>${t('stratTitle')}</h2><p class="hint">${t('stratHint')}</p>`+
    (why?`<p style="margin:0 0 14px;font-size:.9rem"><span class="pill good" style="margin-right:6px">${t('rec')}</span>${why==='incHi'?t('recInc').hi:why==='incLo'?t('recInc').lo:t('recWhy')[why]}</p>`:'')+
    `<div class="strat">${cardHTML}</div></div>`+
    `<div class="panel"><h2>${t('tipsTitle')}</h2><ol class="q">${TIPS.map(x=>`<li>${x[LI()]}</li>`).join('')}</ol></div>`;
}

  else if(el.id==='days')S.days=pf(el.value);
  else if(/^s[0-2]$/.test(el.id))S.scen[+el.id[1]]=pf(el.value);
  else if(/^c[0-2]$/.test(el.id)&&S.cap)S.cap[+el.id[1]]=pf(el.value);
  else if(el.id==='area'){S.area=el.value;save();return;}
  else if(el.id==='pop')S.pop=pf(el.value);
  else if(el.id==='shopName'){S.shop.name=el.value;renderShop();save();return;}
  else if(el.id==='shopSlogan'){S.shop.slogan=el.value;renderShop();save();return;}
  else return;
  renderFinanceResults();renderCompSide();renderLoc();renderPricing();if(el.dataset&&el.dataset.l==='items')renderShop();save();
}
document.addEventListener('input',onInput);document.addEventListener('change',onInput);
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){TAB=b.dataset.tab;showTab();if(TAB==='rapor')renderReport();try{history.replaceState(null,'','#'+TAB);}catch(_){}return;}
  if(b.id==='pdfBtn'||b.id==='pdfTop'){downloadPdf();return;}
  if(b.id==='candSave'){if(CANDS.length>=4){candMsg(t('candMax'));return;}const name=($('candName').value||S.area||t('cmpNow')).trim().slice(0,40);
    CANDS.push({name,ts:Date.now(),state:clone(S)});saveCands();candMsg(t('candSaved')(name));renderReport();return;}
  if(b.dataset.cupd){const cd=CANDS[+b.dataset.cupd];if(cd){cd.state=clone(S);cd.ts=Date.now();saveCands();renderReport();candMsg(t('cUpdDone')+': '+cd.name);}return;}
  if(b.dataset.cload){if(b.dataset.armed){const cd=CANDS[+b.dataset.cload];if(cd){const lang=S.lang;S=clone(cd.state);S.lang=lang;aiText='';full();TAB='rapor';showTab();candMsg('');}}
    else{b.dataset.armed='1';b.textContent=t('cLoadArm');setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=t('cLoad');}},3500);}return;}
  if(b.dataset.cdel2){if(b.dataset.armed){CANDS.splice(+b.dataset.cdel2,1);saveCands();renderReport();candMsg('');}
    else{b.dataset.armed='1';b.textContent=t('mConfirm');setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=t('del');}},3000);}return;}
  if(b.dataset.open){openLb(b.dataset.open);return;}
  if(b.id==='lbClose'){closeLb();return;}
  if(b.id==='lbAi'){lbAnalyze();return;}
  if(b.dataset.mdel){if(b.dataset.armed){await mediaDel(b.dataset.mdel);renderMedia();}else{b.dataset.armed='1';b.textContent=t('mConfirm');setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=t('del');}},3000);}return;}
  if(b.dataset.sug){const x=LB_SUG[+b.dataset.sug];if(!x)return;
    if(x.k==='chk'){S.loc.chk[x.key]=x.v;renderChk();}
    if(x.k==='price'&&S.comp[x.ci]){S.comp[x.ci].price=x.v;renderCompEditors();}
    if(x.k==='tags'&&S.comp[x.ci]){const c=S.comp[x.ci];x.s.forEach(k=>{if(!c.s.includes(k))c.s.push(k);});x.w.forEach(k=>{if(!c.w.includes(k))c.w.push(k);});renderCompEditors();}
    renderAllResults();save();b.textContent=t('applied');b.disabled=true;return;}
  if(b.dataset.add){const l=b.dataset.add;
    S[l].push(l==='items'?{k:null,n:t('newRow'),price:0,cost:0,mix:0}:{k:null,n:t('newRow'),v:0});renderFinanceEditors();renderAllResults();save();return;}
  if(b.dataset.del){S[b.dataset.del].splice(+b.dataset.i,1);renderFinanceEditors();renderAllResults();save();return;}
  if(b.id==='addComp'){S.comp.push({k:null,n:'',dist:500,price:0,rating:0,reviews:0,s:[],w:[],note:''});renderCompEditors();renderAllResults();save();return;}
  if(b.dataset.cdel){S.comp.splice(+b.dataset.cdel,1);renderCompEditors();renderAllResults();save();return;}
  if(b.dataset.kind){const c=S.comp[+b.dataset.ci];const arr=c[b.dataset.kind];const k=b.dataset.tag;const i=arr.indexOf(k);
    if(i>=0)arr.splice(i,1);else arr.push(k);b.setAttribute('aria-pressed',i<0);renderCompSide();renderPricing();save();return;}
  if(b.dataset.apply){const s=strategies().cards.find(x=>x.k===b.dataset.apply);if(!s)return;
    S.items.forEach((it,i)=>{it.price=s.items[i].price;});renderFinanceEditors();renderAllResults();save();b.textContent=t('applied');return;}
  if(b.dataset.pal){S.shop.pal=+b.dataset.pal;renderShopControls();renderShop();save();return;}
  if(b.dataset.style){S.shop.style=+b.dataset.style;renderShopControls();renderShop();save();return;}
  if(b.dataset.awn){S.shop.awning=+b.dataset.awn;renderShopControls();renderShop();save();return;}
  if(b.dataset.chk){S.loc.chk[b.dataset.chk]=b.dataset.v===''?null:+b.dataset.v;renderChk();renderFinanceResults();renderLoc();renderCompSide();save();return;}
  if(b.id==='aiBtn'){runAnalysis();return;}
  if(b.id==='genPrompt'){genPrompt();return;}
  if(b.id==='copyPrompt'){try{await navigator.clipboard.writeText(promptText);b.textContent=t('copied');}catch(_){b.textContent=t('copyFail');const r=document.createRange();r.selectNodeContents($('promptOut'));const s=getSelection();s.removeAllRanges();s.addRange(r);}setTimeout(()=>b.textContent=t('copy'),2000);return;}
  if(b.id==='dlSvg'){saveFile(slug()+'.svg',storefrontSVG());return;}
  if(b.id==='dlPng'){try{const blob=await pngBlob();saveFile(slug()+'.png',blob);}catch(_){$('dlNote').textContent=t('dlNo');}return;}
  if(b.id==='bizCoffee'&&S.biz!=='coffee'){S=fresh('coffee',S.city,S.lang);aiText='';full();}
  if(b.id==='bizBarber'&&S.biz!=='barber'){S=fresh('barber',S.city,S.lang);aiText='';full();}
  if(b.id==='langTr'&&S.lang!=='tr'){S.lang='tr';full();}
  if(b.id==='langEn'&&S.lang!=='en'){S.lang='en';full();}
  if(b.id==='reset'){S=fresh(S.biz,S.city,S.lang);aiText='';full();}
});
$('city').addEventListener('change',e=>{S=fresh(S.biz,e.target.value,S.lang,S.shop);aiText='';full();});
function onChartPointer(e){
  const hit=e.target.closest&&e.target.closest('.hit'),wrap=e.target.closest&&e.target.closest('.pwrap');
  document.querySelectorAll('.ptip').forEach(tp=>{if(!wrap||tp.parentNode!==wrap)tp.hidden=true;});
  if(!hit||!wrap)return;const r=PROJ_ROWS[+hit.dataset.m];if(!r)return;
  const tp=wrap.querySelector('.ptip'),cols=t('cols');
  tp.innerHTML=`<b>${t('monthN')(r.m)}</b><span>${cols[4]}: ${money(r.ni)}</span><span>${cols[5]}: ${money(r.cash)}</span>`;tp.hidden=false;
  const wb=wrap.getBoundingClientRect(),hb=hit.getBoundingClientRect();
  tp.style.left=Math.min(Math.max(hb.left-wb.left+hb.width/2,72),Math.max(72,wb.width-72))+'px';
}
document.addEventListener('pointermove',onChartPointer);document.addEventListener('pointerdown',onChartPointer);
$('mediaInput').addEventListener('change',e=>{handleFiles(e.target.files);e.target.value='';});
const dz=$('dropZone');
['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('over');}));
['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,()=>dz.classList.remove('over')));
dz.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer)handleFiles(e.dataTransfer.files);});
$('lb').addEventListener('click',e=>{if(e.target===$('lb'))closeLb();});
$('lb').addEventListener('close',()=>{const v=$('lbMedia').querySelector('video');if(v)v.pause();$('lbMedia').innerHTML='';LB_ID=null;});
full();
mediaLoad();
})();
</script>
